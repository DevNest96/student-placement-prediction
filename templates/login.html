<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PlacePredict AI Student Placement Intelligence</title>
    <meta name="description" content="Sign in to PlacePredict AI placement prediction and employability analysis portal.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-wrapper">
        <!-- Floating Auth Card -->
        <div class="auth-card glass-panel">
            <!-- Brand Header -->
            <div class="auth-header">
                <div class="logo-icon-lg">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <h1 class="auth-title">PlacePredict <span class="badge-ai">AI 2.0</span></h1>
                <p class="auth-subtitle">Student Placement Prediction & Career Analytics</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" id="tabSignInBtn" role="tab" aria-selected="true">Sign In</button>
                <button type="button" class="auth-tab" id="tabSignUpBtn" role="tab" aria-selected="false">Create Account</button>
            </div>

            <!-- Alert Box -->
            <div class="auth-alert" id="authAlert" style="display: none;">
                <span class="alert-icon" id="alertIcon">!</span>
                <span class="alert-msg" id="alertMsg">Invalid credentials</span>
            </div>

            <!-- Sign In Form -->
            <form id="signInForm" class="auth-form" method="POST" action="/login">
                <div class="input-control">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="loginEmail" name="email" placeholder="name@institution.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="input-control">
                    <div class="control-label-row">
                        <label for="loginPassword">Password</label>
                    </div>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="pwd-toggle-btn" id="loginPwdToggle" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- 1-Click Quick Demo Credentials -->
                <div class="quick-demo-section">
                    <span class="quick-demo-label">⚡ 1-Click Demo Logins:</span>
                    <div class="demo-pills">
                        <button type="button" class="demo-pill" id="demoStudentBtn" data-email="demo@placement.edu" data-pass="demo123">
                            🎓 Student Demo
                        </button>
                        <button type="button" class="demo-pill" id="demoOfficerBtn" data-email="alok@placement.edu" data-pass="alok123">
                            👔 Placement Officer
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-auth" id="signInSubmitBtn">
                    <span>Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <!-- Sign Up Form (Initially Hidden) -->
            <form id="signUpForm" class="auth-form" method="POST" action="/register" style="display: none;">
                <div class="input-control">
                    <label for="regName">Full Name</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="regName" name="name" placeholder="Alex Morgan" required autocomplete="name">
                    </div>
                </div>

                <div class="input-control">
                    <label for="regEmail">Academic Email</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="regEmail" name="email" placeholder="alex@institution.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="input-control">
                    <label for="regRole">Role</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        <select id="regRole" name="role" class="auth-select">
                            <option value="Student">Student Candidate</option>
                            <option value="Placement Officer">Placement Officer</option>
                            <option value="Faculty Mentor">Faculty Mentor</option>
                        </select>
                    </div>
                </div>

                <div class="input-control">
                    <label for="regPassword">Create Password (min. 6 chars)</label>
                    <div class="input-with-icon">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="regPassword" name="password" minlength="6" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="pwd-toggle-btn" id="regPwdToggle" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-auth" id="signUpSubmitBtn">
                    <span>Create Free Account</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="auth-footer-text">
                Protected by PlacePredict Auth • Secure session & hashed credentials
            </div>
        </div>
    </div>

    <!-- Login Page JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabSignIn = document.getElementById('tabSignInBtn');
            const tabSignUp = document.getElementById('tabSignUpBtn');
            const signInForm = document.getElementById('signInForm');
            const signUpForm = document.getElementById('signUpForm');
            const authAlert = document.getElementById('authAlert');
            const alertMsg = document.getElementById('alertMsg');
            const alertIcon = document.getElementById('alertIcon');

            // Tab Switching
            tabSignIn.addEventListener('click', () => {
                tabSignIn.classList.add('active');
                tabSignIn.setAttribute('aria-selected', 'true');
                tabSignUp.classList.remove('active');
                tabSignUp.setAttribute('aria-selected', 'false');
                signInForm.style.display = 'flex';
                signUpForm.style.display = 'none';
                hideAlert();
            });

            tabSignUp.addEventListener('click', () => {
                tabSignUp.classList.add('active');
                tabSignUp.setAttribute('aria-selected', 'true');
                tabSignIn.classList.remove('active');
                tabSignIn.setAttribute('aria-selected', 'false');
                signUpForm.style.display = 'flex';
                signInForm.style.display = 'none';
                hideAlert();
            });

            // Password visibility toggle
            function setupPasswordToggle(toggleBtnId, inputId) {
                const btn = document.getElementById(toggleBtnId);
                const input = document.getElementById(inputId);
                btn.addEventListener('click', () => {
                    const isPwd = input.type === 'password';
                    input.type = isPwd ? 'text' : 'password';
                    btn.style.color = isPwd ? 'var(--accent-primary)' : 'var(--text-muted)';
                });
            }
            setupPasswordToggle('loginPwdToggle', 'loginPassword');
            setupPasswordToggle('regPwdToggle', 'regPassword');

            // Quick Demo logins
            document.querySelectorAll('.demo-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('loginEmail').value = btn.dataset.email;
                    document.getElementById('loginPassword').value = btn.dataset.pass;
                    // Flash effect
                    btn.style.transform = 'scale(0.95)';
                    setTimeout(() => { btn.style.transform = ''; }, 150);
                });
            });

            function showAlert(message, isError = true) {
                authAlert.style.display = 'flex';
                authAlert.className = `auth-alert ${isError ? 'error' : 'success'}`;
                alertIcon.textContent = isError ? '✕' : '✓';
                alertMsg.textContent = message;
            }

            function hideAlert() {
                authAlert.style.display = 'none';
            }

            // AJAX Form submission for Sign In
            signInForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                try {
                    const res = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showAlert('Login successful! Redirecting to studio...', false);
                        setTimeout(() => {
                            window.location.href = data.redirect || '/';
                        }, 600);
                    } else {
                        showAlert(data.message || 'Login failed.');
                    }
                } catch (err) {
                    showAlert('Server connection error. Please try again.');
                }
            });

            // AJAX Form submission for Sign Up
            signUpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                const name = document.getElementById('regName').value;
                const email = document.getElementById('regEmail').value;
                const role = document.getElementById('regRole').value;
                const password = document.getElementById('regPassword').value;

                try {
                    const res = await fetch('/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, role, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showAlert('Account created successfully! Redirecting...', false);
                        setTimeout(() => {
                            window.location.href = data.redirect || '/';
                        }, 800);
                    } else {
                        showAlert(data.message || 'Registration failed.');
                    }
                } catch (err) {
                    showAlert('Server connection error. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
